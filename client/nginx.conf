# client/nginx.conf
# -----------------------------------------------------------------------------
# Serves the React SPA and reverse-proxies the API + WebSocket to the backend
# container ("server" on the compose network). Because everything is same-origin
# from the browser's perspective, there are no CORS issues in production.

upstream backend {
  server server:5000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # REST API -> backend.
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO -> backend, with the WebSocket upgrade headers.
  location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400; # keep long-lived sockets open
  }

  # SPA fallback: every other path serves index.html so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
